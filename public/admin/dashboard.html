<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin Dashboard – SnackTime</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍿</text></svg>">
  <link rel="stylesheet" href="/css/admin.css">
</head>
<body>
  <div class="admin-shell">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <span class="brand-mark"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M5.2 9.6a2.4 2.4 0 0 1-.4-4.5 2.7 2.7 0 0 1 4-2.2A2.6 2.6 0 0 1 12 1.4a2.6 2.6 0 0 1 3.2 1.5 2.7 2.7 0 0 1 4 2.2 2.4 2.4 0 0 1-.4 4.5v.6H5.2v-.6Z"/><path d="M6 11.2h12l-1 8.4a2.4 2.4 0 0 1-2.4 2.1H9.4A2.4 2.4 0 0 1 7 19.6l-1-8.4Z"/></svg></span>
        <div>
          <div class="brand-name">Snack<span>Time</span></div>
          <div class="brand-sub">Admin Panel</div>
        </div>
      </div>

      <nav class="side-nav">
        <div class="side-label">Menu Utama</div>
        <button class="side-btn active" data-tab="dashboard"><span class="ico">📊</span> Dashboard</button>
        <button class="side-btn" data-tab="products"><span class="ico">🍿</span> Manajemen Produk</button>
        <button class="side-btn" data-tab="orders"><span class="ico">🧾</span> Manajemen Pesanan <span class="pill" id="newOrderPill" style="display:none">0</span></button>
        <button class="side-btn" data-tab="transactions"><span class="ico">💳</span> Manajemen Transaksi</button>
        <button class="side-btn" data-tab="shipping"><span class="ico">🛵</span> Manajemen Pengiriman</button>
        <div class="side-label">Lainnya</div>
        <button class="side-btn" data-tab="reports"><span class="ico">📈</span> Laporan Penjualan</button>
        <button class="side-btn" data-tab="settings"><span class="ico">⚙️</span> Pengaturan Toko</button>
      </nav>

      <div class="sidebar-foot">
        <a class="side-link" href="/index.html" target="_blank" rel="noopener">🌐 Lihat Halaman Toko</a>
        <button class="side-link" id="logoutBtn" type="button">🚪 Logout</button>
      </div>
    </aside>

    <div class="admin-main">
      <header class="topbar">
        <button class="sidebar-toggle" id="sidebarToggle" aria-label="Buka menu">☰</button>
        <div>
          <div class="topbar-title" id="tabTitle">Dashboard</div>
          <div class="topbar-sub" id="tabSub">Ringkasan performa toko SnackTime</div>
        </div>
        <div class="topbar-actions">
          <button class="bell" id="bellBtn" aria-label="Notifikasi" type="button">🔔<span class="count" id="bellCount">0</span></button>
          <div class="admin-chip"><span class="admin-avatar">A</span><span class="name">ADMIN</span></div>
        </div>
        <div class="notif-panel" id="notifPanel">
          <div class="notif-head"><span>Notifikasi</span><button id="markReadBtn" type="button">Tandai semua dibaca</button></div>
          <div class="notif-list" id="notifList"></div>
        </div>
      </header>

      <main class="content" id="view">
        <div class="card">Memuat dashboard…</div>
      </main>
    </div>
  </div>

  <div id="modalHost"></div>
  <script src="/js/admin.js"></script>
</body>
</html>
