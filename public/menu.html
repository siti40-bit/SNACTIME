<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Menu Cemilan – SnackTime</title>
  <meta name="description" content="Jelajahi semua menu cemilan SnackTime: cemilan gurih, manis, pedas, makanan ringan, dan minuman.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍿</text></svg>">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div id="app-header"></div>

  <main>
    <section class="page-head">
      <div class="container">
        <div class="breadcrumb"><a href="/index.html">Beranda</a> / Menu Cemilan</div>
        <h1>Menu Cemilan SnackTime</h1>
        <p>Semua cemilan dibuat fresh setiap hari. Pilih kategori, cari nama cemilan, lalu tambahkan ke keranjang.</p>
      </div>
    </section>

    <section class="section" style="padding-top:26px">
      <div class="container">
        <div class="filter-bar">
          <div class="search-box">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.2-3.2"/></svg>
            <input type="search" id="searchInput" placeholder="Cari cemilan, misal: basreng…" autocomplete="off">
          </div>
          <div class="chips" id="categoryChips"></div>
          <select class="select" id="sortSelect" aria-label="Urutkan produk">
            <option value="">Urutkan: Default</option>
            <option value="cheap">Harga termurah</option>
            <option value="expensive">Harga tertinggi</option>
            <option value="name">Nama A–Z</option>
          </select>
        </div>

        <div class="result-line" id="resultLine">Memuat produk…</div>
        <div class="product-grid" id="productGrid"></div>
      </div>
    </section>
  </main>

  <div id="app-footer"></div>

  <script src="/js/common.js"></script>
  <script src="/js/menu.js"></script>
</body>
</html>
